<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TapBack — Browser Preview</title>
  <style>
    :root {
      --primary: #5eead4;
      --coral: #e07a5f;
      --surface: #0b1414;
      --card: #152020;
      --text: #e7f4f2;
      --muted: #b7c9c6;
      --border: #1c2c2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #163030 0%, var(--surface) 55%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }
    .header { text-align: center; max-width: 720px; margin-bottom: 24px; }
    .header img { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 12px; }
    .header h1 { margin: 0 0 8px; color: var(--primary); }
    .header p { margin: 0; color: var(--muted); line-height: 1.5; }
    .phones {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      width: 100%;
    }
    .phone {
      width: min(360px, 100%);
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .45);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .status-bar {
      background: #102222;
      color: var(--primary);
      padding: 14px 20px;
      font-weight: 600;
    }
    .content { padding: 20px; display: grid; gap: 14px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      background: #121c1c;
    }
    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #042f2e;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.coral { background: var(--coral); color: #fff; font-size: 1.15rem; }
    .popup {
      display: none;
      border-radius: 18px;
      overflow: hidden;
      background: #102222;
      color: #fff;
    }
    .popup.show { display: block; }
    .popup img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .popup-body { padding: 14px; }
    .popup strong { display: block; margin-bottom: 4px; color: var(--primary); font-size: 1.15rem; }
    .log { font-size: .9rem; color: var(--muted); display: grid; gap: 8px; }
    .log div { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .ok { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../branding/tapback-app-icon.png" alt="TapBack icon" />
    <h1>TapBack</h1>
    <p>A tap that says I&rsquo;m here. Dark-mode preview of a sender and a lock-screen popup the receiver can ack without opening the app.</p>
  </div>
  <div class="phones">
    <div class="phone">
      <div class="status-bar">You (sender)</div>
      <div class="content">
        <div class="card">
          Connected with <strong>Alex</strong>
          <button class="btn" id="send">Send check-in</button>
          <p id="senderStatus">No check-in sent yet.</p>
        </div>
        <div class="card">
          <strong>Check-in log</strong>
          <div class="log" id="senderLog"></div>
        </div>
      </div>
    </div>
    <div class="phone">
      <div class="status-bar">Alex (receiver)</div>
      <div class="content">
        <div class="popup" id="popup">
          <img src="../branding/tapback-popup-art.png" alt="" />
          <div class="popup-body">
            <strong>Check-in from You</strong>
            Tap to let them know you&rsquo;re here.
            <button class="btn coral" id="ack">I&rsquo;m here</button>
          </div>
        </div>
        <div class="card">
          <strong>Check-in log</strong>
          <div class="log" id="receiverLog"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const send = document.getElementById("send");
    const ack = document.getElementById("ack");
    const popup = document.getElementById("popup");
    const senderStatus = document.getElementById("senderStatus");
    const senderLog = document.getElementById("senderLog");
    const receiverLog = document.getElementById("receiverLog");
    let sentAt = null;

    function stamp() {
      return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
    }

    send.addEventListener("click", () => {
      sentAt = stamp();
      popup.classList.add("show");
      senderStatus.textContent = "Waiting for them to tap back…";
      senderLog.insertAdjacentHTML("afterbegin", `<div>You sent · on demand · sent<br>Sent ${sentAt}</div>`);
      receiverLog.insertAdjacentHTML("afterbegin", `<div>You received · on demand · received, waiting<br>Sent ${sentAt} · Received ${sentAt}</div>`);
    });

    ack.addEventListener("click", () => {
      const acked = stamp();
      popup.classList.remove("show");
      senderStatus.innerHTML = `<span class="ok">They tapped back</span> at ${acked}`;
      senderLog.insertAdjacentHTML("afterbegin", `<div>You sent · on demand · tapped back<br>Sent ${sentAt} · Ack ${acked}</div>`);
      receiverLog.insertAdjacentHTML("afterbegin", `<div>You received · on demand · tapped back<br>Sent ${sentAt} · Ack ${acked}</div>`);
    });
  </script>
</body>
</html>
